# Runs the backend test suite (backend/tests, about 10 s) on every pull request and every push to main.
# Actions are pinned to a commit SHA (the tag is in the comment); update both together.
name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.17"
          working-directory: backend
          enable-cache: true

      # Render builds with `uv sync --frozen` (docs/hosting.md), which trusts uv.lock as is: fail here if
      # pyproject.toml changed without `uv lock`.
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      - name: pytest
        run: uv run pytest -q
