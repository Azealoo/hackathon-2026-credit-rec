[project]
name = "fineprint-backend"
version = "0.1.0"
description = "Fine Print backend: /v1/check, /v1/coverage, /v1/store/pay (SPEC.md §9.2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11,<3",
    "httpx>=0.27",
    "jinja2>=3.1",
    # Validates contracts/ in tests now, and data/cards.json at startup from step 2 (catalog.py).
    "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
